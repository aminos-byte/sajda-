<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sajda ya Bhimaaa ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(circle at center, #5b0b52, #18001f 60%, #050008);

            font-family: Arial, sans-serif;
        }


        /* =========================
           SAJDA YA BHIMAAA
        ========================= */

        .love {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 100;

            color: white;

            font-size: clamp(40px, 7vw, 100px);

            font-weight: bold;

            white-space: nowrap;

            text-shadow:
                0 0 10px #ffb6df,
                0 0 25px #ff4fa3,
                0 0 50px #ff0088,
                0 0 90px #ff0088;

            animation: loveAnimation 2.5s infinite ease-in-out;
        }


        @keyframes loveAnimation {

            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -55%) scale(1.08);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }

        }


        /* =========================
           CATS
        ========================= */

        .cat {
            position: absolute;

            bottom: -100px;

            font-size: 55px;

            z-index: 10;

            animation: catAnimation linear infinite;

            user-select: none;
        }


        @keyframes catAnimation {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform:
                    translateY(-55vh)
                    rotate(180deg);
            }

            100% {
                transform:
                    translateY(-120vh)
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* =========================
           CAT POSITIONS
        ========================= */

        .cat1 {
            left: 3%;
            animation-duration: 8s;
        }

        .cat2 {
            left: 12%;
            animation-duration: 11s;
            animation-delay: -3s;
        }

        .cat3 {
            left: 22%;
            animation-duration: 7s;
            animation-delay: -5s;
        }

        .cat4 {
            left: 32%;
            animation-duration: 10s;
            animation-delay: -2s;
        }

        .cat5 {
            left: 42%;
            animation-duration: 13s;
            animation-delay: -8s;
        }

        .cat6 {
            left: 52%;
            animation-duration: 8s;
            animation-delay: -4s;
        }

        .cat7 {
            left: 62%;
            animation-duration: 12s;
            animation-delay: -7s;
        }

        .cat8 {
            left: 72%;
            animation-duration: 9s;
            animation-delay: -2s;
        }

        .cat9 {
            left: 82%;
            animation-duration: 11s;
            animation-delay: -6s;
        }

        .cat10 {
            left: 92%;
            animation-duration: 7s;
            animation-delay: -4s;
        }


        /* =========================
           HEARTS
        ========================= */

        .heart {
            position: absolute;

            bottom: -50px;

            color: #ff4fa3;

            font-size: 30px;

            z-index: 5;

            text-shadow:
                0 0 10px #ff0088,
                0 0 25px #ff0088;

            animation: heartAnimation linear infinite;
        }


        @keyframes heartAnimation {

            0% {
                transform:
                    translateY(0)
                    scale(.5)
                    rotate(0deg);

                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    scale(1.5)
                    rotate(360deg);

                opacity: 0;
            }

        }


        .heart1 {
            left: 8%;
            animation-duration: 6s;
        }

        .heart2 {
            left: 28%;
            animation-duration: 9s;
            animation-delay: -4s;
        }

        .heart3 {
            left: 48%;
            animation-duration: 7s;
            animation-delay: -2s;
        }

        .heart4 {
            left: 68%;
            animation-duration: 10s;
            animation-delay: -6s;
        }

        .heart5 {
            left: 88%;
            animation-duration: 8s;
            animation-delay: -3s;
        }


        /* =========================
           STARS
        ========================= */

        .star {
            position: absolute;

            width: 5px;
            height: 5px;

            background: white;

            border-radius: 50%;

            box-shadow: 0 0 15px white;

            animation: starAnimation 2s infinite alternate;
        }


        @keyframes starAnimation {

            from {
                opacity: .2;
                transform: scale(.5);
            }

            to {
                opacity: 1;
                transform: scale(1.5);
            }

        }

    </style>

</head>


<body>


    <!-- SAJDA YA BHIMAAA -->

    <div class="love">
        Sajda ya Bhimaaa ❤️
    </div>


    <!-- CATS -->

    <div class="cat cat1">🐱</div>
    <div class="cat cat2">😺</div>
    <div class="cat cat3">😸</div>
    <div class="cat cat4">😻</div>
    <div class="cat cat5">😽</div>
    <div class="cat cat6">🐈</div>
    <div class="cat cat7">😹</div>
    <div class="cat cat8">🐱</div>
    <div class="cat cat9">😺</div>
    <div class="cat cat10">😻</div>


    <!-- HEARTS -->

    <div class="heart heart1">❤️</div>
    <div class="heart heart2">💗</div>
    <div class="heart heart3">💖</div>
    <div class="heart heart4">💕</div>
    <div class="heart heart5">❤️</div>


    <!-- STARS -->

    <div class="star" style="left:10%; top:15%;"></div>
    <div class="star" style="left:25%; top:30%;"></div>
    <div class="star" style="left:40%; top:10%;"></div>
    <div class="star" style="left:60%; top:25%;"></div>
    <div class="star" style="left:75%; top:12%;"></div>
    <div class="star" style="left:90%; top:35%;"></div>
    <div class="star" style="left:15%; top:65%;"></div>
    <div class="star" style="left:85%; top:70%;"></div>


</body>

</html>
